name: CI Spring Boot (Jenkins Migration)

on:
  push:
    branches:
      - master

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout (comme Jenkins Git clone)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (équivalent agent Jenkins)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3. Build (mvn clean install)
      - name: Build project
        run: mvn clean install

      # 4. Tests (Jenkins stage test)
      - name: Run tests
        run: mvn test

      # 5. SonarQube (stage sonar Jenkins)
      - name: SonarQube analysis
        run: mvn sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
