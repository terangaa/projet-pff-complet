name: CI Spring Boot Full Pipeline

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 3. Build project (sans tests pour éviter MySQL crash)
      - name: Build project
        run: mvn clean install -DskipTests

      # 4. Run tests séparément (optionnel)
      - name: Run tests
        run: mvn test
        continue-on-error: true

      # 5. SonarQube analysis
      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
          -Dsonar.projectKey=projet-pff-complet \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # 6. Build artifact (optionnel)
      - name: Package JAR
        run: mvn package -DskipTests
