<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Liste des ventes - Gestion Agricole</title>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* ===== BACKGROUND VERT PREMIUM ===== */
        body {
            background: linear-gradient(135deg, #d8f5d3, #ecfff4, #e0ffe8);
            background-size: 350% 350%;
            animation: smoothMove 11s ease infinite;
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        @keyframes smoothMove {
            0% {background-position: 0% 50%}
            50% {background-position: 100% 50%}
            100% {background-position: 0% 50%}
        }

        /* ===== NAVBAR GLASS ===== */
        .navbar {
            background: rgba(40,150,70,0.65) !important;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
        }
        .navbar-brand { font-weight: 800; }

        /* ===== TITLE ===== */
        h2 {
            font-weight: 800;
            color: #1b5e20;
            letter-spacing: .5px;
        }

        /* ===== CONTENT SHADOW BOX ===== */
        .table-container {
            background: rgba(255,255,255,0.9);
            border-radius: 26px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 32px;
            animation: fadeIn 1s ease;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: translateY(20px)}
            to {opacity:1; transform: translateY(0)}
        }

        /* ===== MINI-CARDS MOBILE ===== */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }
        .sale-card {
            width: 100%;
            max-width: 300px;
            border-radius: 18px;
            background: rgba(255,255,255,0.92);
            overflow: hidden;
            box-shadow: 0 6px 22px rgba(0,0,0,0.12);
            transition: 0.35s ease;
            cursor: pointer;
        }
        .sale-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 14px 32px rgba(0,0,0,0.18);
        }
        .sale-card img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            transition: 0.3s ease;
        }
        .sale-card:hover img {
            transform: scale(1.05);
            filter: brightness(1.05);
        }
        .sale-card .card-body {
            padding: 18px 20px;
        }
        .sale-card h5 {
            font-weight: 700;
            color: #2a7d3c;
        }

        /* ===== BADGES ===== */
        .badge-status {
            padding: 6px 12px;
            font-size: .8rem;
            border-radius: 10px;
            font-weight: 600;
        }
        .badge-success { background: #4caf50 !important; }
        .badge-warning { background: #ffeb3b !important; color: #6d6d00 !important; }
        .badge-danger { background: #e53935 !important; }

        /* ===== PAGINATION ===== */
        .pagination .page-link {
            border-radius: 12px;
            padding: 8px 14px;
        }
        .pagination .active .page-link {
            background-color: #43a047;
            border-color: #43a047;
            color: #fff !important;
        }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 768px) { #cardsContainer { display: none; } }
        @media (max-width: 768px) { .table-responsive { display: none; } }

        .sale-card.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        /* ===== FOOTER ===== */
        footer {
            background: rgba(40,150,70,0.85);
            color: #fff;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🌾 Gestion Agricole</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a th:href="@{/dashboard}" class="btn btn-outline-light me-2">🏠 Accueil</a></li>
                <li class="nav-item">
                    <a href="/auth/logout" class="btn btn-light btn-sm rounded-pill">
                        <i class="bi bi-box-arrow-right"></i> Déconnexion
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== PAGE CONTENT ===== -->
<div class="container mt-5 pb-5">
    <div class="d-flex justify-content-between mb-4 flex-wrap">
        <h2>🛒 Liste des ventes</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/ventes/ajouter}" class="btn btn-success shadow-sm px-3">
            <i class="bi bi-plus-circle"></i> Ajouter
        </a>
    </div>

    <div class="table-container">
        <!-- SEARCH -->
        <input type="text" id="searchInput" class="form-control mb-2 shadow-sm"
               placeholder="🔍 Rechercher client ou produit..." onkeyup="filterCards()">

        <select id="statusFilter" class="form-select mb-3 shadow-sm" onchange="filterCards()">
            <option value="">Tous les statuts</option>
            <option value="VALIDEE">Validée</option>
            <option value="EN_COURS">En cours</option>
            <option value="ANNULEE">Annulée</option>
        </select>

        <!-- TABLE DESKTOP -->
        <div th:if="${!ventes.isEmpty()}" class="table-responsive">
            <table class="table table-hover align-middle text-center table-bordered">
                <thead class="table-success">
                <tr>
                    <th>ID</th><th>Produit</th><th>Client</th><th>Prix</th><th>Quantité</th>
                    <th>Montant</th><th>Date</th>
                    <th sec:authorize="hasRole('ADMIN')">Statut</th>
                    <th sec:authorize="hasRole('ADMIN')">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vente : ${ventes}">
                    <td th:text="${vente.id}"></td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img th:src="${vente.produit?.image != null ? vente.produit.image : '/images/placeholder.png'}"
                                 style="width:50px;height:50px;object-fit:cover;border-radius:10px;">
                            <span th:text="${vente.produit?.nom}"></span>
                        </div>
                    </td>
                    <td th:text="${vente.acheteur?.nom}"></td>
                    <td th:text="${#numbers.formatDecimal(vente.prix,1,2)} + ' F CFA'"></td>
                    <td th:text="${vente.quantite}"></td>
                    <td th:text="${#numbers.formatDecimal(vente.montantTotal,1,2)} + ' F CFA'"></td>
                    <td th:text="${#temporals.format(vente.dateVente,'dd/MM/yyyy HH:mm')}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <span th:switch="${vente.commande?.statut}">
                            <span th:case="'VALIDEE'" class="badge-status badge-success">Validée</span>
                            <span th:case="'EN_COURS'" class="badge-status badge-warning">En cours</span>
                            <span th:case="'ANNULEE'" class="badge-status badge-danger">Annulée</span>
                            <span th:case="*">Aucune</span>
                        </span>
                    </td>
                    <td sec:authorize="hasRole('ADMIN')" class="d-flex justify-content-center gap-1">
                        <a th:href="@{/ventes/modifier/{id}(id=${vente.id})}" class="btn btn-sm btn-primary">✏</a>
                        <a th:href="@{/ventes/supprimer/{id}(id=${vente.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Supprimer ?')">🗑</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- MINI CARDS MOBILE -->
        <div id="cardsContainer" class="cards-container mt-4">
            <div th:each="vente : ${ventes}" class="sale-card">
                <img th:src="${vente.produit?.image != null ? vente.produit.image : '/images/placeholder.png'}">
                <div class="card-body">
                    <h5 th:text="${vente.produit?.nom}"></h5>
                    <p><i class="bi bi-person-fill text-success"></i> <span th:text="${vente.acheteur?.nom}"></span></p>
                    <p><i class="bi bi-cash-stack text-success"></i> <span th:text="${#numbers.formatDecimal(vente.prix,1,2)} + ' F CFA'"></span></p>
                    <p><i class="bi bi-box-seam"></i> Quantité : <span th:text="${vente.quantite}"></span></p>
                    <p><i class="bi bi-wallet2"></i> <span th:text="${#numbers.formatDecimal(vente.montantTotal,1,2)} + ' F CFA'"></span></p>
                    <p class="text-muted"><i class="bi bi-calendar"></i> <span th:text="${#temporals.format(vente.dateVente,'dd/MM/yyyy HH:mm')}"></span></p>
                    <div sec:authorize="hasRole('ADMIN')" class="d-flex justify-content-between mt-2">
                        <a th:href="@{/ventes/modifier/{id}(id=${vente.id})}" class="btn btn-sm btn-primary">✏</a>
                        <a th:href="@{/ventes/supprimer/{id}(id=${vente.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Supprimer ?')">🗑</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGINATION -->
        <nav class="mt-4 d-flex justify-content-center">
            <ul class="pagination" id="pagination"></ul>
        </nav>
    </div>
</div>

<!-- ===== FOOTER ===== -->
<footer class="py-4">
    <p>🌾 Gestion Agricole &copy; 2025</p>
    <small>Développé avec ❤️ pour simplifier la gestion des ventes</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let currentPage = 1;
    const cardsPerPage = 5;

    function showPage() {
        const cards = Array.from(document.querySelectorAll("#cardsContainer .sale-card"));
        const totalPages = Math.ceil(cards.length / cardsPerPage);

        cards.forEach((card, index) => {
            if (index >= (currentPage - 1) * cardsPerPage && index < currentPage * cardsPerPage) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        const pagination = document.getElementById("pagination");
        pagination.innerHTML = "";

        const prev = document.createElement("li");
        prev.className = `page-item ${currentPage === 1 ? "disabled" : ""}`;
        prev.innerHTML = `<a class="page-link">Précédent</a>`;
        prev.onclick = () => { if(currentPage>1){ currentPage--; showPage(); } };
        pagination.appendChild(prev);

        for (let i = 1; i <= totalPages; i++){
            const li = document.createElement("li");
            li.className = `page-item ${i===currentPage?"active":""}`;
            li.innerHTML = `<a class="page-link">${i}</a>`;
            li.onclick = () => { currentPage = i; showPage(); };
            pagination.appendChild(li);
        }

        const next = document.createElement("li");
        next.className = `page-item ${currentPage===totalPages?"disabled":""}`;
        next.innerHTML = `<a class="page-link">Suivant</a>`;
        next.onclick = () => { if(currentPage<totalPages){ currentPage++; showPage(); } };
        pagination.appendChild(next);
    }

    function filterCards() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const status = document.getElementById("statusFilter").value.toLowerCase();

        document.querySelectorAll("#cardsContainer .sale-card").forEach(card => {
            const produit = card.querySelector("h5").textContent.toLowerCase();
            const client = card.querySelector("p span").textContent.toLowerCase();
            card.classList.toggle("hidden", !(produit.includes(search) || client.includes(search)));
        });

        currentPage = 1;
        showPage();
    }

    window.onload = showPage;
</script>

</body>
</html>
