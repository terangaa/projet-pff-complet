<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une Vente - Gestion Agricole</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* ===== BODY & BACKGROUND ===== */
        body {
            background: linear-gradient(135deg, #d8f5d3, #ecfff4, #e0ffe8);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            font-family: "Poppins", sans-serif;
        }
        @keyframes bgMove {
            0% {background-position: 0% 50%}
            50% {background-position: 100% 50%}
            100% {background-position: 0% 50%}
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: rgba(40,150,70,0.85) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .navbar-brand { font-weight: 800; }

        /* ===== FORM CONTAINER ===== */
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(255,255,255,0.95);
            padding: 30px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: fadeIn 1s ease;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: translateY(20px);}
            to {opacity:1; transform: translateY(0);}
        }
        h2 {
            color: #2a7d3c;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            background-color: #43a047;
            border-color: #43a047;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #388e3c;
            border-color: #388e3c;
        }
        .btn-secondary {
            background-color: #a5d6a7;
            border-color: #a5d6a7;
            color: #1b5e20;
        }
        .btn-secondary:hover {
            background-color: #81c784;
            border-color: #81c784;
        }

        /* ===== FOOTER ===== */
        footer {
            background-color: rgba(40,150,70,0.85);
            color: #fff;
            padding: 20px 0;
            text-align: center;
            backdrop-filter: blur(8px);
            margin-top: 50px;
        }
        footer p, footer small {
            margin: 0;
            transition: 0.3s;
        }
        footer p:hover, footer small:hover {
            color: #c8f7c5;
        }
    </style>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand text-light" th:href="@{/dashboard}">🌾 Gestion Agricole</a>
        <div class="d-flex ms-auto">
            <a class="btn btn-outline-light me-2" th:href="@{/dashboard}">🏠 Accueil</a>
            <a href="/auth/logout" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="bi bi-box-arrow-right"></i> Déconnexion
            </a>
        </div>
    </div>
</nav>

<!-- ===== FORM ===== -->
<div class="form-container">
    <h2>Ajouter une Vente</h2>
    <form th:action="@{/ventes/ajouter}" th:object="${vente}" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="produit" class="form-label">Produit</label>
            <select id="produit" name="produit.id" th:field="*{produit.id}" class="form-select" required>
                <option value="" disabled selected>-- Choisir un produit --</option>
                <option th:each="p : ${produits}" th:value="${p.id}" th:text="${p.nom}" th:data-prix="${p.prix}"></option>
            </select>
            <div class="invalid-feedback">Veuillez sélectionner un produit.</div>
        </div>

        <div class="mb-3">
            <label for="acheteur" class="form-label">Acheteur</label>
            <select id="acheteur" name="acheteur.id" th:field="*{acheteur.id}" class="form-select" required>
                <option value="" disabled selected>-- Choisir un acheteur --</option>
                <option th:each="u : ${utilisateurs}" th:value="${u.id}" th:text="${u.nom}"></option>
            </select>
            <div class="invalid-feedback">Veuillez sélectionner un acheteur.</div>
        </div>

        <div class="mb-3">
            <label for="quantite" class="form-label">Quantité</label>
            <input type="number" id="quantite" th:field="*{quantite}" class="form-control" min="1" value="1" required>
            <div class="invalid-feedback">Veuillez entrer une quantité valide.</div>
        </div>

        <div class="mb-3">
            <label for="prix" class="form-label">Prix unitaire</label>
            <input type="number" step="0.01" id="prix" th:field="*{prix}" class="form-control" min="0" readonly>
        </div>

        <div class="mb-3">
            <label for="montantTotal" class="form-label">Montant Total</label>
            <input type="number" step="0.01" id="montantTotal" class="form-control" readonly>
        </div>

        <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary me-2">Ajouter</button>
            <a th:href="@{/ventes}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>

<!-- ===== FOOTER ===== -->
<footer>
    <p>🌾 Gestion Agricole &copy; 2025</p>
    <small>Développé avec ❤️ pour simplifier la gestion des ventes</small>
</footer>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict';
        // Validation Bootstrap
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });

        // Calcul dynamique prix et montant
        const produitSelect = document.getElementById('produit');
        const quantiteInput = document.getElementById('quantite');
        const prixInput = document.getElementById('prix');
        const montantTotalInput = document.getElementById('montantTotal');

        function updatePrixMontant() {
            const selectedOption = produitSelect.selectedOptions[0];
            const prix = parseFloat(selectedOption?.dataset.prix || 0);
            const quantite = parseInt(quantiteInput.value) || 0;
            prixInput.value = prix.toFixed(2);
            montantTotalInput.value = (prix * quantite).toFixed(2);
        }

        produitSelect.addEventListener('change', updatePrixMontant);
        quantiteInput.addEventListener('input', updatePrixMontant);
        window.addEventListener('DOMContentLoaded', updatePrixMontant);
    })();
</script>

</body>
</html>
