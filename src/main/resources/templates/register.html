<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plateforme Agricole - Inscription</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
        }

        /* Soleil animé */
        .sun {
            position: absolute;
            top: 8%;
            right: 10%;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #fff176, #ffd600);
            border-radius: 50%;
            box-shadow: 0 0 60px 15px rgba(255,215,0,0.3);
            animation: rotateSun 60s linear infinite;
            z-index: 1;
        }

        /* Nuages animés */
        .cloud {
            position: absolute;
            background: #ffffffcc;
            border-radius: 50%;
            width: 120px;
            height: 60px;
            animation: cloudMove linear infinite;
            z-index: 2;
        }
        .cloud:nth-child(1) { left: -200px; top: 12%; animation-duration: 90s; }
        .cloud:nth-child(2) { left: -400px; top: 18%; width: 180px; height: 80px; animation-duration: 120s; }
        .cloud:nth-child(3) { left: -600px; top: 8%; width: 150px; height: 70px; animation-duration: 150s; }

        /* Herbes ondulantes */
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: repeating-linear-gradient(to right, #388e3c, #388e3c 2px, #43a047 2px, #43a047 4px);
            animation: grassSway 4s ease-in-out infinite alternate;
            z-index: 2;
        }

        /* Fleurs animées */
        .flower {
            position: absolute;
            bottom: 50px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: growFlower 4s ease-in-out infinite alternate, swayFlower 3s ease-in-out infinite alternate;
            z-index: 2;
        }
        .flower::before, .flower::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background-color: inherit;
        }
        .flower::before { width: 12px; height: 12px; left: -8px; top: 0; }
        .flower::after { width: 12px; height: 12px; left: 8px; top: 0; }
        .flower:nth-child(4) { left: 15%; background-color:#ff9800; animation-delay: 0.5s; }
        .flower:nth-child(5) { left: 30%; background-color:#ff4081; animation-delay: 0s; }
        .flower:nth-child(6) { left: 45%; background-color:#ffeb3b; animation-delay: 1s; }
        .flower:nth-child(7) { left: 60%; background-color:#ff5722; animation-delay: 2s; }
        .flower:nth-child(8) { left: 75%; background-color:#e91e63; animation-delay: 3s; }
        .flower:nth-child(9) { left: 85%; background-color:#4caf50; animation-delay: 1.5s; }

        /* Carte compacte */
        .register-card {
            position: relative;
            z-index: 3;
            max-width: 420px;
            padding: 30px 25px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
            border: 2px solid #81c784;
            animation: fadeIn 1s ease-in-out;
        }

        /* Titres et champs */
        .register-card h2 {
            color: #2e7d32;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .register-card .form-control {
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #a5d6a7;
            font-size: 0.95rem;
        }
        .register-card .form-control:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 6px rgba(46,125,50,0.4);
        }
        .btn-register {
            background-color: #4caf50;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            background-color: #388e3c;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        }
        .login-link {
            color: #2e7d32;
            font-weight: 600;
            text-decoration: none;
        }
        .login-link:hover { color:#1b5e20; text-decoration: underline; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes rotateSun { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes cloudMove { from { transform: translateX(0); } to { transform: translateX(200vw); } }
        @keyframes grassSway { from { transform: translateX(0); } to { transform: translateX(5px); } }
        @keyframes growFlower { from { transform: scale(0.2); } to { transform: scale(1); } }
        @keyframes swayFlower { from { transform: translateX(0); } to { transform: translateX(5px); } }
    </style>
</head>
<body>

<!-- Soleil et nuages -->
<div class="sun"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<!-- Herbes et fleurs -->
<div class="grass"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>
<div class="flower"></div>

<!-- Carte compacte d’inscription -->
<div class="register-card">
    <h2><i class="bi bi-tree"></i> Inscription</h2>
    <p style="text-align:center; font-size:0.9rem;">Rejoignez notre plateforme agricole</p>

    <form th:action="@{/auth/register}" method="post">
        <div class="row g-2 mb-2">
            <div class="col">
                <input type="text" name="nom" class="form-control" placeholder="Nom" required>
            </div>
            <div class="col">
                <input type="text" name="prenom" class="form-control" placeholder="Prénom" required>
            </div>
        </div>

        <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
        <div class="row g-2 mb-2">
            <div class="col">
                <input type="password" name="motDePasse" class="form-control" placeholder="Mot de passe" required>
            </div>
            <div class="col">
                <input type="password" name="confirmMotDePasse" class="form-control" placeholder="Confirmez" required>
            </div>
        </div>

        <select name="role" class="form-control mb-2" required>
            <option value="" disabled selected>-- Sélectionnez un rôle --</option>
            <option value="AGRICULTEUR">Agriculteur</option>
            <option value="ACHETEUR">Client</option>
        </select>

        <button type="submit" class="btn btn-register w-100 mb-1"><i class="bi bi-check-circle"></i> S'inscrire</button>
    </form>

    <p class="text-center mt-1">Déjà inscrit ? <a th:href="@{/auth/login}" class="login-link">Connectez-vous</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
