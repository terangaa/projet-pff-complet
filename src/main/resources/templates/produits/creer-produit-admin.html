<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un produit - Admin</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eaf5ea, #c8f0c8, #f0fff0);
            min-height: 100vh;
            overflow-x: hidden;
            color: #1b1b1b;
        }

        /* Bulles vertes animées */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0.15;
            animation: pulse 12s infinite alternate;
        }
        .shape1 { width: 200px; height: 200px; background: #a8e0a8; top: 12%; left: 5%; }
        .shape2 { width: 270px; height: 270px; background: #d0f0d0; bottom: 10%; right: 6%; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: .1; }
            100% { transform: scale(1.15); opacity: .25; }
        }

        /* Carte du formulaire glass + lisible */
        .card-custom {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 650px;
            animation: slideUp 0.7s ease;
            border: 1px solid rgba(76,175,80,0.3);
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Titres */
        h2 {
            font-weight: 700;
            font-size: 2rem;
            color: #2e7d32;
        }
        p.sub-title {
            font-size: 1rem;
            color: #4caf50;
        }

        /* Inputs et selects */
        .form-control, .form-select {
            border-radius: 12px;
            padding: .75rem 1rem;
            border: 1px solid rgba(0,0,0,0.15);
            background: #ffffff;
            color: #1b1b1b;
        }
        .form-control::placeholder, .form-select option {
            color: #555;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4caf50;
            box-shadow: 0 0 0 .2rem rgba(76,175,80,0.2);
            background: #f8fff8;
        }

        .input-group-text {
            background: #f0fff0;
            color: #2e7d32;
            border-radius: 10px 0 0 10px;
            border: 1px solid rgba(76,175,80,0.3);
        }

        /* Boutons verts */
        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #81c784);
            padding: .7rem 1.4rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 0 10px rgba(76,175,80,0.4);
            transition: .3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(76,175,80,0.6);
        }

        /* Image preview */
        #preview {
            max-height: 180px;
            border-radius: 14px;
            margin-top: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transition: .3s;
        }
        #preview:hover { transform: scale(1.03); }
    </style>
</head>

<body>

<!-- Bulles vertes -->
<div class="shape shape1"></div>
<div class="shape shape2"></div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card-custom">

        <div class="text-center mb-4">
            <i class="bi bi-box2-heart fs-1 text-success"></i>
            <h2 class="mt-3">Créer un Nouveau Produit</h2>
            <p class="sub-title">Ajoutez un article à votre catalogue</p>
        </div>

        <!-- Messages -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/produits/creer-admin}" th:object="${produit}" method="post" enctype="multipart/form-data">

            <!-- Nom -->
            <div class="mb-3">
                <label class="form-label">Nom du produit</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-tag"></i></span>
                    <input th:field="*{nom}" class="form-control" placeholder="Ex : Tomates bio" required>
                </div>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Ex : Produit frais et naturel"></textarea>
            </div>

            <!-- Prix -->
            <div class="mb-3">
                <label class="form-label">Prix unitaire (FCFA)</label>
                <input type="number" th:field="*{prix}" class="form-control" placeholder="Ex : 1000" required oninput="updatePrixTotal()">
            </div>

            <!-- Quantité -->
            <div class="mb-3">
                <label class="form-label">Quantité</label>
                <input type="number" th:field="*{quantite}" min="1" class="form-control" placeholder="Ex : 20" required oninput="updatePrixTotal()">
            </div>

            <!-- Prix Total -->
            <div class="mb-3">
                <label class="form-label">Prix total estimé</label>
                <input type="text" id="prixTotal" class="form-control bg-light fw-bold" readonly>
            </div>

            <!-- Image -->
            <div class="mb-3">
                <label class="form-label">Image du produit</label>
                <input type="file" name="imageFile" class="form-control" accept="image/*" onchange="previewImage(event)">
                <img id="preview" src="#" class="d-none">
            </div>

            <!-- Producteur -->
            <div class="mb-4">
                <label class="form-label">Choisir un producteur</label>
                <select name="agriculteurId" class="form-select">
                    <option value="">-- Aucun --</option>
                    <option th:each="prod : ${agriculteurs}" th:value="${prod.id}" th:text="${prod.prenom + ' ' + prod.nom}"></option>
                </select>
            </div>

            <!-- Boutons -->
            <div class="d-flex justify-content-between">
                <a th:href="@{/produits}" class="btn btn-light">
                    <i class="bi bi-arrow-left"></i> Retour
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Créer le produit
                </button>
            </div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('preview');
        if(input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { preview.src = e.target.result; preview.classList.remove('d-none'); };
            reader.readAsDataURL(input.files[0]);
        }
    }
    function updatePrixTotal() {
        const prix = parseFloat(document.querySelector("[name='prix']").value) || 0;
        const quantite = parseInt(document.querySelector("[name='quantite']").value) || 0;
        document.getElementById('prixTotal').value =
            (prix * quantite).toLocaleString('fr-FR') + " FCFA";
    }
</script>

</body>
</html>
