<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📦 Gestion du Stock des Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0ffe8, #d8f5d3, #ecfff4);
            background-size: 300% 300%;
            animation: gradientMove 12s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        @keyframes gradientMove {
            0% {background-position: 0% 50%}
            50% {background-position: 100% 50%}
            100% {background-position: 0% 50%}
        }

        /* Navbar */
        .navbar {
            background: rgba(27, 94, 32, 0.85) !important;
            backdrop-filter: blur(8px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.15);
        }
        .navbar-brand { font-weight: 700; }

        /* TITLE */
        h2 {
            color: #1b5e20;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Cards */
        .product-card {
            transition: all 0.35s;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.12);
        }
        .product-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 14px 32px rgba(0,0,0,0.18);
        }
        .product-img { height: 180px; object-fit: cover; }

        /* Input & button */
        .input-stock { max-width: 100px; border-radius: 8px; }
        .btn-update-stock { border-radius: 8px; transition: 0.3s; }
        .btn-update-stock:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }

        /* Toast */
        #toastContainer { position: fixed; top: 20px; right: 20px; z-index: 1050; min-width: 250px; }

        /* Retour */
        .btn-back { display: inline-block; margin-top: 30px; border-radius: 12px; padding: 8px 20px; font-weight: 600; background: #1b5e20; color: #fff; transition: 0.3s; }
        .btn-back:hover { background: #43a047; text-decoration: none; }

        /* Footer */
        footer {
            margin-top: auto;
            background: rgba(27,94,32,0.9);
            color: #fff;
            text-align: center;
            padding: 15px 0;
            font-weight: 500;
        }
        footer a { color: #fff; text-decoration: underline; }
        footer a:hover { color: #c8e6c9; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">🌾 Gestion Agricole</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard">🏠 Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="/ventes">🛒 Ventes</a></li>
                <li class="nav-item"><a class="nav-link" href="/produits">📦 Produits</a></li>
                <li class="nav-item"><a class="nav-link" href="/auth/logout">🔒 Déconnexion</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENU -->
<div class="container mt-5">
    <h2>📦 Gestion du Stock des Produits</h2>
    <div id="toastContainer"></div>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${produits}" th:data-id="${p.id}">
            <div class="card h-100 product-card">
                <img th:src="${p.image != null ? p.image : '/images/produit-placeholder.png'}"
                     class="card-img-top product-img" th:alt="${p.nom}">
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${p.nom}">Nom Produit</h5>
                    <p class="card-text" th:text="'Agriculteur : ' + (p.agriculteur != null ? p.agriculteur.prenom + ' ' + p.agriculteur.nom : 'Inconnu')"></p>
                    <p class="card-text">Stock actuel : <span class="stock" th:text="${p.stock}">0</span></p>
                    <div class="d-flex justify-content-center mt-2">
                        <input type="number" class="form-control me-2 input-stock" th:value="${p.stock}" min="0">
                        <button type="button" class="btn btn-success btn-sm btn-update-stock">💾</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer>
    🌱 Gestion Agricole - Tous droits réservés © 2025 | <a href="/contact">Contact</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showToast(message, type='success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast align-items-center text-bg-${type} border-0`;
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-${type==='success'?'check-circle':'exclamation-triangle'} me-2"></i>
                    ${message}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;
        container.appendChild(toast);
        const bsToast = new bootstrap.Toast(toast, { delay: 4000 });
        bsToast.show();
        toast.addEventListener('hidden.bs.toast', () => toast.remove());
    }

    function updateStockProduit(produitId, nouveauStock) {
        const produitCard = document.querySelector(`.col[data-id='${produitId}']`);
        if(produitCard) {
            produitCard.querySelector('.stock').textContent = nouveauStock;
            produitCard.querySelector('.input-stock').value = nouveauStock;
        }
    }

    document.querySelectorAll('.btn-update-stock').forEach(btn => {
        btn.addEventListener('click', function() {
            const col = this.closest('.col');
            const id = col.dataset.id;
            const stockInput = col.querySelector('.input-stock');
            const nouveauStock = stockInput.value;

            fetch(`/modifier-stock/${id}?stock=${nouveauStock}`, { method: 'POST' })
                .then(res => res.text())
                .then(data => {
                    if(data === 'OK') {
                        updateStockProduit(id, nouveauStock);
                        showToast('Stock mis à jour !', 'success');
                    } else {
                        showToast('Erreur lors de la mise à jour du stock', 'danger');
                    }
                })
                .catch(() => showToast('Erreur lors de la mise à jour du stock', 'danger'));
        });
    });
</script>
</body>
</html>
