<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Plateforme Agricole</title>

    <!-- Bootstrap CSS & icônes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fond avec image réelle */
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Nuages animés */
        .cloud {
            position: absolute;
            background: #ffffffcc;
            border-radius: 50%;
            width: 150px;
            height: 80px;
            animation: cloudMove linear infinite;
            top: 15%;
            z-index: 1;
        }
        .cloud:nth-child(1) { left: -200px; animation-duration: 100s; }
        .cloud:nth-child(2) { left: -400px; animation-duration: 130s; top: 20%; width: 200px; height: 90px; }
        .cloud:nth-child(3) { left: -600px; animation-duration: 160s; top: 10%; width: 170px; height: 80px; }

        /* Carte de connexion */
        .login-card {
            position: relative;
            z-index: 2;
            background-color: rgba(255,255,255,0.95);
            padding: 3rem 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 450px;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 70px rgba(0,0,0,0.3);
        }
        .login-card h2 { color: #2e7d32; font-weight: 800; letter-spacing: 1px; }

        .btn-login {
            background: linear-gradient(135deg, #43a047, #8bc34a);
            border: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #8bc34a, #43a047);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(56,142,60,0.3);
        }

        .input-group-text { background: #e8f5e9; border: none; color: #2e7d32; }
        .form-control:focus { border-color: #8bc34a; box-shadow: 0 0 8px rgba(139,195,74,0.3); }
        .form-label { font-weight: 600; }
        a { color: #2e7d32; text-decoration: none; }
        a:hover { text-decoration: underline; color: #1b5e20; }

        .alert-success, .alert-danger {
            border-radius: 1rem;
            font-weight: 500;
            animation: slideDown 0.5s ease-in-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes cloudMove { from { transform: translateX(0); } to { transform: translateX(200vw); } }

        /* Responsive */
        @media (max-width: 768px) {
            .login-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

<!-- Nuages animés -->
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

<!-- Carte de connexion -->
<div class="login-card">
    <img th:src="@{/images/utilisateurs/agriculture.jpeg}" alt="Logo" class="logo rounded-circle shadow-sm border border-success mb-3"/>
    <h2 class="mb-4"><i class="fas fa-leaf me-2 text-success"></i>Connexion</h2>

    <!-- Messages d'erreur / succès -->
    <div th:if="${param.error}" class="alert alert-danger">Identifiants invalides</div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <!-- Formulaire de connexion -->
    <form th:action="@{/auth/login}" method="post">
        <div class="mb-3 text-start">
            <label class="form-label" for="email">Email :</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="text" name="email" id="email" class="form-control" placeholder="Entrez votre email" required />
            </div>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label" for="motDePasse">Mot de passe :</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="motDePasse" id="motDePasse" class="form-control" placeholder="Entrez votre mot de passe" required />
            </div>
        </div>

        <button type="submit" class="btn btn-login w-100 text-white shadow-sm mb-3">
            <i class="fas fa-sign-in-alt me-2"></i> Connexion
        </button>
    </form>

    <div class="mt-3 text-end">
        <a th:href="@{/auth/oublier-password}">Mot de passe oublié ?</a>
    </div>

    <p class="mt-4">
        <i class="fas fa-user-plus text-success me-1"></i> Pas encore de compte ?
        <a th:href="@{/auth/register}">Inscrivez-vous</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
