<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes - Historique</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e6f2ea, #f5f8f5);
            font-family: 'Segoe UI', sans-serif;
            color: #333;
        }

        /* Navbar */
        .navbar {
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .navbar.bg-success {
            background-color: #198754 !important;
        }

        /* Titres */
        h2 {
            font-weight: 700;
            color: #198754;
        }

        /* Barre de recherche */
        #searchInput {
            max-width: 500px;
            margin: auto;
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
            transition: box-shadow 0.3s;
        }
        #searchInput:focus {
            box-shadow: 0 5px 20px rgba(25,135,84,0.4);
            outline: none;
        }

        /* Cartes commandes */
        .order-card {
            position: relative;
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .order-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .order-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px 15px 0 0;
            transition: transform 0.5s;
        }
        .order-card:hover img {
            transform: scale(1.05);
        }

        /* Overlay détails */
        .order-overlay {
            position: absolute;
            bottom: -100%;
            width: 100%;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: bottom 0.3s, opacity 0.3s;
            border-radius: 0 0 15px 15px;
            opacity: 0;
        }
        .order-card:hover .order-overlay {
            bottom: 0;
            opacity: 1;
        }

        /* Badges */
        .badge-quantity {
            background-color: #198754;
            color: #fff;
            font-weight: 600;
            padding: 0.4em 0.6em;
            border-radius: 8px;
            margin-right: 5px;
            display: inline-block;
        }
        .badge-total {
            background-color: #28a745;
            color: #fff;
            font-weight: 600;
            padding: 0.4em 0.6em;
            border-radius: 8px;
            display: inline-block;
        }

        /* Bouton flottant */
        .btn-float {
            position: absolute;
            top: 12px;
            right: 12px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #fff;
            background: #198754;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 10;
        }
        .btn-float:hover {
            background-color: #145c32;
            transform: scale(1.1);
        }

        /* Card Body */
        .card-body {
            padding: 12px;
            text-align: center;
        }
        .card-body h6 {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 5px;
            color: #198754;
        }

        /* Masquer les éléments pour recherche */
        .order-item {
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
        }
        .order-item.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            height: 0;
            margin: 0;
            padding: 0;
        }

        /* Footer */
        footer {
            font-size: 0.9rem;
            background-color: #198754;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">🌾 Plateforme Agricole</a>
        <div class="d-flex align-items-center ms-auto">
            <span class="text-white me-3">👤 Connecté : <b th:text="${email}"></b></span>
            <a class="btn btn-outline-light me-3" th:href="@{/dashboard}"><i class="bi bi-house-door"></i> Accueil</a>
            <a href="/auth/logout" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4 text-center">📦 Historique de mes commandes</h2>

    <!-- Barre de recherche -->
    <div class="mb-4 text-center">
        <input type="text" id="searchInput" class="form-control" placeholder="Rechercher une commande...">
    </div>

    <!-- Alerte si aucune commande -->
    <div th:if="${#lists.isEmpty(commandes)}" class="alert alert-info text-center">
        Vous n'avez encore passé aucune commande.
    </div>

    <!-- Grille commandes -->
    <div class="row g-4" th:if="${!#lists.isEmpty(commandes)}">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 order-item" th:each="commande : ${commandes}" th:data-name="${commande.produit.nom.toLowerCase()}">
            <div class="order-card shadow-sm h-100 position-relative">
                <img th:if="${commande.produit.image != null}" th:src="@{${commande.produit.image}}" alt="Produit">
                <button class="btn-float"><i class="bi bi-heart"></i></button>
                <div class="order-overlay">
                    <p th:text="${commande.produit.description}">Description du produit</p>
                    <span class="badge-quantity">Quantité : <span th:text="${commande.quantite}">1</span></span>
                    <span class="badge-total">Prix total : <span th:text="${commande.prixTotal}">0</span> FCFA</span>
                    <p class="text-light small mt-2" th:text="${#temporals.format(commande.dateCommande, 'dd/MM/yyyy HH:mm')}">01/01/2025 12:00</p>
                </div>
                <div class="card-body mt-2">
                    <h6 class="fw-bold" th:text="${commande.produit.nom}">Nom Produit</h6>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" aria-label="Pagination" class="mt-4">
        <ul class="pagination justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/commandes(page=${currentPage - 1})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/commandes(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/commandes(page=${currentPage + 1})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>

<footer class="text-white text-center py-3 mt-5 shadow-sm">
    <p class="mb-0">© 2025 - Plateforme Agricole - Mes Commandes</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const searchInput = document.getElementById('searchInput');
    const orders = document.querySelectorAll('.order-item');

    searchInput.addEventListener('input', () => {
        const term = searchInput.value.toLowerCase();
        orders.forEach(o => o.dataset.name.includes(term) ? o.classList.remove('hidden') : o.classList.add('hidden'));
    });
</script>
</body>
</html>
