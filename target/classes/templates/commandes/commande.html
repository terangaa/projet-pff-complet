<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>📦 Mes Commandes - AgriShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* GLOBAL BACKGROUND */
        body {
            background: linear-gradient(135deg, #e8f9f3, #ffffff, #f1fff7);
            background-size: 400% 400%;
            animation: gradientMove 9s ease infinite;
            font-family: 'Poppins', sans-serif;
        }

        @keyframes gradientMove {
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(90deg, #34a853, #66bb6a);
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .navbar-brand i {
            transform: rotate(-10deg);
            transition: 0.3s ease;
        }
        .navbar-brand:hover i {
            transform: rotate(0deg);
        }

        /* COMMANDES CARDS */
        .commande-card {
            background: rgba(255,255,255,0.85);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: 0.3s ease;
            overflow: hidden;
        }

        .commande-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 16px 40px rgba(0,0,0,0.12);
        }

        .product-image {
            height: 200px;
            width: 100%;
            object-fit: cover;
            transition: 0.3s ease;
        }

        .commande-card:hover .product-image {
            transform: scale(1.05);
        }

        .badge-promo {
            background: linear-gradient(45deg,#ff6b6b,#ff3d3d);
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-action:hover {
            transform: scale(1.15);
        }

        /* FOOTER GLASS EFFECT */
        .glass-footer {
            background: rgba(52, 168, 83, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
            max-width: 1000px;
            margin: 60px auto 20px;
            animation: fadeIn 1s ease;
        }

        .glass-footer a:hover {
            color: #ffffff;
            transform: scale(1.25);
            transition: 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-basket"></i> AgriShop
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/dashboard}">
                <i class="bi bi-house-door-fill"></i> Accueil
            </a>
            <a class="nav-link" th:href="@{/produits}">
                <i class="bi bi-shop-window"></i> Produits
            </a>
            <a class="nav-link" th:href="@{/auth/logout}">
                <i class="bi bi-box-arrow-right"></i> Déconnexion
            </a>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-success"><i class="bi bi-receipt"></i> Mes Commandes</h2>

        <a th:href="@{/produits}" class="btn btn-success shadow-sm px-4">
            <i class="bi bi-cart-plus"></i> Nouvel achat
        </a>
    </div>

    <!-- LISTE DES COMMANDES OU MESSAGE VIDE -->
    <div th:if="${commandes.isEmpty()}" class="alert alert-info text-center py-5 shadow-sm rounded-4">
        <i class="bi bi-info-circle" style="font-size: 4rem;"></i>
        <h4 class="mt-3">Aucune commande trouvée</h4>
        <p class="text-muted">Vos commandes apparaîtront ici après validation du panier.</p>
    </div>

    <div th:if="${!commandes.isEmpty()}">
        <div class="row">
            <div th:each="commande : ${commandes}" class="col-md-6 col-lg-4 mb-4">
                <div class="card commande-card h-100">

                    <!-- Image -->
                    <div class="position-relative" th:if="${commande.produit.image != null}">
                        <img th:src="${commande.produit.image}" alt="Produit" class="product-image">
                        <div th:if="${commande.produit.promo}" class="badge-promo position-absolute top-0 m-3">Promo</div>
                    </div>

                    <!-- Header -->
                    <div class="card-header bg-success text-white d-flex justify-content-between">
                        <h6 class="mb-0"><i class="bi bi-file-earmark-text-fill"></i>
                            Commande #<span th:text="${commande.id}"></span>
                        </h6>

                        <div class="d-flex gap-1">
                            <button class="btn btn-success btn-sm btn-action"
                                    th:onclick="'validerCommande(' + ${commande.id} + ')' "
                                    th:disabled="${commande.statut=='VALIDEE'}">
                                <i class="bi bi-check-circle-fill"></i>
                            </button>

                            <button class="btn btn-danger btn-sm btn-action"
                                    th:onclick="'annulerCommande(' + ${commande.id} + ')' "
                                    th:disabled="${commande.statut=='ANNULEE' or commande.statut=='VALIDEE'}">
                                <i class="bi bi-x-circle-fill"></i>
                            </button>

                            <button class="btn btn-outline-light btn-sm btn-action"
                                    th:onclick="'supprimerCommande(' + ${commande.id} + ')' ">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Body -->
                    <div class="card-body">

                        <small>Date</small>
                        <div th:text="${#temporals.format(commande.dateCommande, 'dd/MM/yyyy HH:mm')}"></div>

                        <hr>

                        <small>Produit</small>
                        <div class="fw-bold" th:text="${commande.produit.nom}"></div>

                        <small>Description</small>
                        <div class="text-muted" th:text="${commande.produit.description}"></div>

                        <hr>

                        <div class="row">
                            <div class="col-6">
                                <small>Quantité</small>
                                <div class="fw-bold" th:text="${commande.quantite}"></div>
                            </div>
                            <div class="col-6">
                                <small>Stock</small>
                                <div class="fw-bold" th:text="${commande.produit.stock}"></div>
                            </div>
                        </div>

                        <hr>

                        <small>Statut</small>
                        <div class="mt-1">
                            <span th:if="${commande.statut=='VALIDEE'}" class="badge bg-success">Validée</span>
                            <span th:if="${commande.statut=='EN_COURS'}" class="badge bg-warning">En cours</span>
                            <span th:if="${commande.statut=='ANNULEE'}" class="badge bg-danger">Annulée</span>
                            <span th:if="${commande.statut==null || commande.statut=='EN_ATTENTE'}" class="badge bg-secondary">En attente</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER GLASSMORPHISM -->
<footer class="glass-footer text-white py-4 text-center">
    <p class="mb-1">&copy; 2025 AgriShop - Tous droits réservés.</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="#" class="text-white fs-5"><i class="bi bi-facebook"></i></a>
        <a href="#" class="text-white fs-5"><i class="bi bi-twitter"></i></a>
        <a href="#" class="text-white fs-5"><i class="bi bi-instagram"></i></a>
        <a href="#" class="text-white fs-5"><i class="bi bi-envelope-fill"></i></a>
    </div>
</footer>

</body>
</html>
